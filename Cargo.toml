[workspace]
exclude = ["sdks/typescript"]
members = [
    "crates/mentedb",
    "crates/mentedb-core",
    "crates/mentedb-graph",
    "crates/mentedb-query",
    "crates/mentedb-context",
    "crates/mentedb-server",
    "crates/mentedb-cognitive",
    "crates/mentedb-consolidation",
    "crates/mentedb-embedding",
    "crates/mentedb-extraction",
    "crates/mentedb-sqlite",
]
resolver = "2"

[workspace.package]
version = "0.9.2"
edition = "2024"
authors = ["Nam Rodriguez <nambok@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Spsden/grasp"
description = "A SQLite-backed AI memory layer for agents"

[workspace.dependencies]
# Core
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }

# Collections & Data Structures
ahash = "0.8"
parking_lot = "0.12"
smallvec = "1"

# Hashing & Checksums
fs2 = "0.4"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Internal crates
mentedb = { path = "crates/mentedb", version = "0.9.2" }
mentedb-core = { path = "crates/mentedb-core", version = "0.9.2" }
mentedb-graph = { path = "crates/mentedb-graph", version = "0.9.2" }
mentedb-query = { path = "crates/mentedb-query", version = "0.9.2" }
mentedb-context = { path = "crates/mentedb-context", version = "0.9.2" }
mentedb-cognitive = { path = "crates/mentedb-cognitive", version = "0.9.2" }
mentedb-consolidation = { path = "crates/mentedb-consolidation", version = "0.9.2" }
mentedb-embedding = { path = "crates/mentedb-embedding", version = "0.9.2" }
mentedb-extraction = { path = "crates/mentedb-extraction", version = "0.9.2" }
mentedb-sqlite = { path = "crates/mentedb-sqlite", version = "0.9.2" }
